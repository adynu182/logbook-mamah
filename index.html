<title>Catatan Harian Perawatan</title>
<!--
SETUP (sekali saja)
1. console.firebase.google.com > buat project > Build > Firestore Database > Create.
2. Project settings > Your apps > Web (</>) > salin firebaseConfig ke firebase-config.js.
3. Firestore > Rules, tempel lalu Publish:
   rules_version='2'; service cloud.firestore { match /databases/{d}/documents {
     match /catatan/{i} { allow read, create, delete: if true; }
     match /jadwal/{i}  { allow read, create, delete: if true; } } }
4. Upload index.html dan firebase-config.js ke Firebase Hosting / Netlify / GitHub Pages, lalu bagikan link ke caregiver dan keluarga.
Catatan: tanpa login, siapa pun yang punya link bisa membaca dan mengisi. Jangan sebarkan link.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght@24,500&icon_names=add,bar_chart,bed,calendar_month,check,chevron_left,chevron_right,content_copy,download,edit_note,medication,menu_book,monitor_heart,radio_button_unchecked,restaurant,sentiment_satisfied,upload_file,warning,wc&display=block" rel="stylesheet">
<style>
:root{--fs:1;--bg:#E6EFEE;--s:#fff;--ink:#14282B;--mut:#47595D;--ln:#B7C9CC;--ed:#8FA7AB;--br:#17606B;--brd:#0B3B43;--brs:#D6EAEC;--ok:#23704E;--wn:#8A520C;--bd:#B3261E;--bds:#FCE9E6;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(17px*var(--fs))/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;padding-bottom:calc(160px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit}
.vital{--c:#17606B;--cs:#D6EAEC}.makan{--c:#9A5B12;--cs:#F7E6CE}.obat{--c:#6B4FA0;--cs:#E7DFF3}.elim{--c:#3F7A31;--cs:#DDEED6}.kondisi{--c:#2A6AA3;--cs:#DAE8F5}.lain,.jd{--c:#5F6B70;--cs:#E3E8EA}
/* tombol 3D: timbul, turun saat ditekan */
.b1,.b2,.chip,.cat,.fab,.hd,.x,.dn button,nav button{cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 5px 0 var(--ed),0 9px 12px -3px #14282B66;transition:transform .06s,box-shadow .06s}
.b1:active,.b2:active,.chip:active,.cat:active,.fab:active,.hd:active,.x:active,.dn button:active,nav button:active{transform:translateY(5px);box-shadow:0 0 0 var(--ed),0 2px 3px #14282B66}
header{position:sticky;top:0;z-index:5;background:var(--br);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 14px;box-shadow:0 3px 10px #0003}
.dn{display:flex;align-items:center;gap:8px;max-width:560px;margin:auto}
.dn b{flex:1;text-align:center;font-size:calc(21px*var(--fs));line-height:1.2}
.dn small{display:block;font-weight:400;font-size:calc(15px*var(--fs));opacity:.9}
.dn button{--ed:var(--brd);width:48px;height:48px;padding:0;border:2px solid var(--brd);border-radius:50%;background:#fff;color:var(--br);font-size:calc(28px*var(--fs));line-height:1}
.dn button:disabled{opacity:.35;box-shadow:none;transform:translateY(5px)}
main{max-width:560px;margin:auto;padding:14px}
h2{font-size:calc(20px*var(--fs));margin:6px 0 12px;line-height:1.25}.hd2{margin:22px 0 12px}
.card{background:var(--s);border:2px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 4px 0 var(--ln)}
.card.bad{background:var(--bds);border-color:#E6B3AD;box-shadow:0 4px 0 #E6B3AD}
.m0{margin:0 0 6px}.sub{color:var(--mut);font-size:calc(15px*var(--fs));margin:8px 0}
.note{background:#FFF1CF;border:2px solid #EBCB85;border-radius:16px;padding:14px;font-size:calc(15px*var(--fs));margin:0 0 16px}.note.bad{background:var(--bds);border-color:#E6B3AD;color:var(--bd)}
.bar{height:12px;background:var(--brs);border-radius:8px;overflow:hidden;margin-bottom:14px;box-shadow:inset 0 2px 3px #0003}.bar i{display:block;height:100%;background:var(--ok);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:14px;font-size:calc(15px*var(--fs));font-weight:700;background:#F8E9D0;color:var(--wn)}.tag.ok{background:#D8EFE2;color:var(--ok)}
.b1,.b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:2px solid var(--ed);border-radius:14px;font-size:calc(17px*var(--fs));font-weight:700}
.b1{--ed:var(--brd);background:linear-gradient(#1F7381,var(--br));color:#fff}
.b2{background:linear-gradient(#fff,#EEF4F5);color:var(--br)}
.b2.sm{min-height:44px;padding:0 14px;font-size:calc(15px*var(--fs));margin-bottom:12px}
.w{width:100%;margin:16px 0 8px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:46px;padding:0 16px;border:2px solid var(--ed);border-radius:23px;background:linear-gradient(#fff,#EEF4F5);font-size:calc(17px*var(--fs));color:var(--ink)}
.chip.on{--ed:var(--brd);background:var(--br);border-color:var(--brd);color:#fff;font-weight:700;transform:translateY(4px);box-shadow:0 1px 0 var(--ed),inset 0 3px 6px #0006}
.chip.on::before{content:"check";content:"check"/""}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 20px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;padding:8px 6px;border:2px solid var(--ed);border-radius:20px;background:linear-gradient(#fff,#EEF4F5);font-size:calc(17px*var(--fs));font-weight:700;line-height:1.2;color:var(--ink);text-align:center}
.cat i,.ft i{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--cs);font-style:normal;font-size:calc(26px*var(--fs))}
.ft{display:flex;align-items:center;gap:12px}
.e{display:flex;gap:12px;align-items:flex-start;background:var(--s);border:2px solid var(--ln);border-left:8px solid var(--c,var(--br));border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 3px 0 var(--ln)}
.e>div:not(.hm){flex:1;min-width:0}.e b{display:block;font-size:calc(17px*var(--fs))}.e span{display:block;word-break:break-word}
.hm{flex:none;min-width:70px;text-align:center;background:var(--cs,var(--brs));color:var(--c,var(--br));font-weight:700;font-size:calc(19px*var(--fs));border-radius:12px;padding:6px 4px}
.e small{display:block;color:var(--mut);font-size:calc(14px*var(--fs));margin-top:2px}.fw{display:flex;align-items:flex-start;gap:4px;margin:4px 0;color:var(--bd);font-weight:700}
.e.fl{--c:var(--bd);--cs:#F7CFCA;background:var(--bds);border-color:#E6B3AD;border-left-color:var(--bd)}
.x{--ed:#D9A6A0;flex:none;min-height:44px;padding:0 12px;border:2px solid #D9A6A0;border-radius:12px;background:linear-gradient(#fff,#FBE4E1);color:#8C1D18;font-size:calc(14px*var(--fs));font-weight:700}
.hd{display:block;position:relative;width:100%;text-align:left;padding:14px 50px 14px 16px;margin-bottom:14px;border:2px solid var(--ed);border-radius:18px;background:linear-gradient(#fff,#F1F6F6);font-size:calc(17px*var(--fs));color:inherit}
.hd::after{content:"chevron_right";content:"chevron_right"/"";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:calc(28px*var(--fs));color:var(--br)}
.hd b{display:block;font-size:calc(17px*var(--fs))}.hd span{display:block;color:var(--mut);font-size:calc(15px*var(--fs))}.hd em{display:block;font-style:normal;font-weight:700;color:var(--bd);font-size:calc(15px*var(--fs))}
.fab{--ed:var(--brd);display:flex;align-items:center;justify-content:center;gap:8px;position:fixed;left:0;right:0;margin:0 auto;width:calc(100% - 28px);max-width:532px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;min-height:54px;border:2px solid var(--brd);border-radius:27px;background:linear-gradient(#1F7381,var(--br));color:#fff;font-size:calc(19px*var(--fs));font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#CFE0E2;border-top:2px solid var(--ed)}
nav button{flex:1;min-height:58px;border:2px solid var(--ed);border-radius:16px;background:linear-gradient(#fff,#EEF4F5);color:var(--ink);font-size:calc(15px*var(--fs));font-weight:700;line-height:1.2}
nav button .mi{display:block;font-size:calc(24px*var(--fs))}
nav button.on{--ed:var(--brd);background:var(--br);border-color:var(--brd);color:#fff;transform:translateY(4px);box-shadow:0 1px 0 var(--ed),inset 0 3px 6px #0006}
.fld{display:block;margin:18px 0;font-weight:700;font-size:calc(17px*var(--fs))}
.fld input,.fld textarea,.fld select{display:block;width:100%;min-height:50px;margin-top:6px;padding:10px 12px;border:2px solid var(--ed);border-radius:12px;font-size:calc(17px*var(--fs));font-weight:400;background:#fff;color:var(--ink);box-shadow:inset 0 3px 5px #14282B22}
.fld textarea{min-height:80px}
.u{position:relative;display:block}.u input{padding-right:78px}.u i{position:absolute;right:12px;bottom:15px;color:var(--mut);font-style:normal;font-weight:400;font-size:calc(15px*var(--fs))}
dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:28px 28px 0 0;max-height:94vh;overflow:auto;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#0009}
.sh{padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
.grip{width:56px;height:6px;border-radius:3px;background:var(--ed);margin:4px auto 14px}
.acts{display:flex;gap:14px;margin-top:8px}.acts button{flex:1}.er{color:var(--bd);font-weight:700;font-size:calc(15px*var(--fs));min-height:1.5em;margin:10px 0}
#toast{position:fixed;left:50%;bottom:calc(148px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:24px;font-size:calc(15px*var(--fs));white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
.cht{display:block;width:100%;height:auto}.cht text{font-size:calc(13px*var(--fs));fill:#47595D}.cht .v{font-size:calc(13px*var(--fs));font-weight:700;fill:#14282B}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--s);border:2px solid var(--ln);border-radius:16px;padding:12px 4px;text-align:center;box-shadow:0 3px 0 var(--ln)}
.st span{display:block;font-weight:700;color:var(--mut);font-size:calc(14px*var(--fs))}.st b{display:block;font-size:calc(24px*var(--fs));line-height:1.15}.st small{display:block;font-size:calc(13px*var(--fs));color:var(--mut)}
.st.bad{background:var(--bds);border-color:#E6B3AD}.st.bad b{color:var(--bd)}
.lgs{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 8px;font-size:calc(15px*var(--fs))}
.lg::before{content:"";display:inline-block;width:30px;border-top:4px solid var(--c);vertical-align:middle;margin-right:8px}.lg.dsh::before{border-top-style:dashed}
.fsr{max-width:560px;margin:12px auto 0;padding:0 14px;display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--mut);font-weight:700}
.fsr b{min-width:56px;text-align:center;color:var(--ink)}
.fsb{min-height:44px;min-width:52px;padding:0 12px;font-size:17px}.fsb[data-fs="1"]{font-size:24px}
.fsb:disabled{opacity:.35;box-shadow:none;transform:translateY(5px)}
nav button{font-size:calc(15px*min(var(--fs),1.15))}
body.past header,body.past main{filter:grayscale(1)}
/* legenda obat (dashboard) */
.sw{display:inline-flex;align-items:center;gap:6px;font-size:calc(14px*var(--fs))}.sw .kd{flex:none;min-width:2.1em;padding:1px 5px;border-radius:5px;background:var(--c);color:var(--t,#fff);font-size:.9em;font-weight:700;line-height:1.35;text-align:center}
.cht .kd{font-size:calc(12px*min(var(--fs),1.2));font-weight:700;pointer-events:none}
/* ikon Material Symbols (ligature) */
.mi,.chip.on::before,.hd::after{font-family:"Material Symbols Rounded";font-weight:500;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
.mi{display:inline-block;flex:none;font-size:1.25em;user-select:none}
.chip.on::before{font-size:1.25em}
.dn button .mi{font-size:1em}
:focus-visible{outline:4px solid #E0A526;outline-offset:2px}
</style>
</head>
<body>
<header><div class="dn"><button id="pv" aria-label="Hari sebelumnya"><i class="mi" aria-hidden="true">chevron_left</i></button><b id="dl"></b><button id="nx" aria-label="Hari berikutnya"><i class="mi" aria-hidden="true">chevron_right</i></button></div></header>
<div class="fsr" hidden><span>Ukuran tulisan</span><button type="button" class="b2 fsb" data-fs="-1" aria-label="Perkecil tulisan">A−</button><b id="fsv">100%</b><button type="button" class="b2 fsb" data-fs="1" aria-label="Perbesar tulisan">A+</button></div>
<main id="v"></main>
<button class="fab" id="add"><i class="mi" aria-hidden="true">add</i>Tambah Catatan</button>
<nav><button data-tab="now"><i class="mi" aria-hidden="true">edit_note</i>Catatan</button><button data-tab="dash"><i class="mi" aria-hidden="true">bar_chart</i>Dashboard</button><button data-tab="jad"><i class="mi" aria-hidden="true">calendar_month</i>Jadwal</button></nav>
<dialog id="sh"><div id="sb"></div></dialog>
<div id="toast" role="status"></div>
<input type="file" id="impf" accept=".json,application/json" hidden>

<script src="firebase-config.js"></script>
<script type="module">
// ===== PENGATURAN =====
const CFG=window.firebaseConfig||{}; // diisi dari firebase-config.js
const LIM={sisMax:160,sisMin:90,diaMax:100,nadiMin:50,nadiMax:110,spo2Min:94}; // sesuaikan anjuran dokter
const DAYS=21; // lama riwayat yang dimuat

const MEDS=['Clopidogrel bisulfate 75 mg','Atorvastatin calcium 20 mg','Mecobalamin 500 mg','Lansoprazole 30 mg','Paracetamol 500 mg','Astika (asetosal) 100 mg','Candesartan cilexetil 8 mg','Furosemide 40 mg','Cavicur','Spironolakton 25 mg','Notisil (warfarin) 2 mg','Digoxin 0,25 mg','Sukralfat sirup 500 mg/5 ml'];
const KODE={'Clopidogrel bisulfate 75 mg':'cl','Atorvastatin calcium 20 mg':'at','Mecobalamin 500 mg':'mc','Lansoprazole 30 mg':'lz','Paracetamol 500 mg':'pc','Astika (asetosal) 100 mg':'as','Candesartan cilexetil 8 mg':'cn','Furosemide 40 mg':'fu','Cavicur':'cv','Spironolakton 25 mg':'sp','Notisil (warfarin) 2 mg':'nt','Digoxin 0,25 mg':'dx','Sukralfat sirup 500 mg/5 ml':'su'}; // kode 2 huruf di legenda dan grafik obat
const kode=n=>KODE[n]||String(n).trim().slice(0,2).toLowerCase(); // obat di luar daftar: pakai 2 huruf pertama
const T={vital:'Tensi & saturasi',makan:'Makan & minum',obat:'Obat diminum',elim:'Ganti pampers',kondisi:'Kondisi',lain:'Aktivitas & lainnya'};
const F={ // [kunci, label, tipe(n=angka,1=pilih satu,m=pilih banyak,t=teks), opsi/satuan]
vital:[['sis','Sistol (angka atas)','n','mmHg'],['dia','Diastol (angka bawah)','n','mmHg'],['nadi','Nadi','n','x/menit'],['spo2','Saturasi oksigen','n','%']],
makan:[['waktu','Waktu makan','1',['Pagi','Siang','Malam','Camilan']],['cat','Menu dan keterangan','t','Mis. bubur 2 sendok, apel 2 potong'],['ml','Minum','n','ml'],['tersedak','Batuk atau tersedak','1',['Tidak','Ya']]],
obat:[['obat','Obat yang diminum','m',MEDS],['cat','Catatan (opsional)','t']],
elim:[['jenis','Isi pampers','1',['BAK','BAB','BAK dan BAB','Kering']],['banyak','Jumlah','1',['Sedikit','Sedang','Banyak']],['ket','Kondisi','1',['Normal','Lembek/cair','Keras','Pekat/keruh','Ada darah']],['cat','Catatan (opsional)','t']],
kondisi:[['sadar','Kesadaran','1',['Sadar penuh','Mengantuk','Sulit dibangunkan']],['bicara','Bicara','1',['Jelas','Pelo','Lebih sulit','Tidak bicara']],['tangan','Kekuatan tangan/kaki','1',['Seperti biasa','Lebih baik','Lebih lemah']],['nyeri','Nyeri','1',['Tidak ada','Ringan','Sedang','Berat']],['mood','Suasana hati','1',['Tenang','Gelisah','Sedih']],['cat','Catatan (opsional)','t']],
lain:[['jenis','Kegiatan','1',['Fisioterapi','Ubah posisi','Latihan gerak','Mandi/kebersihan','Cek kulit','Tidur','Kejadian khusus']],['cat','Keterangan','t']]};
const KEY={makan:'waktu',obat:'obat',elim:'jenis',lain:'jenis'};
const IC={vital:'monitor_heart',makan:'restaurant',obat:'medication',elim:'wc',kondisi:'sentiment_satisfied',lain:'bed'}; // nama ikon Material Symbols
const ic=n=>`<i class="mi" aria-hidden="true">${n}</i>`;

// ===== UTIL =====
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const iso=d=>d.toLocaleDateString('sv-SE'),today=iso(new Date());
const add=(d,n=0,m=0)=>{const x=new Date(d+'T00:00');x.setMonth(x.getMonth()+m);x.setDate(x.getDate()+n);return iso(x)};
const fmt=(d,l)=>new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:l?'long':'short',day:'numeric',month:'short'});
const tm=e=>new Date(e.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace(':','.');
const cmp=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)};
let nm='';try{nm=localStorage.getItem('by')||''}catch(e){}
let tab='now',cur=today,all=[],jad=[],day=[],kind='vital',vals={},err='',jam='',step=0;

// ===== UKURAN TULISAN (A- / A+): kontrolnya hanya tampil di tab Jadwal, ukurannya berlaku di semua tab =====
const FS=[.9,1,1.15,1.3,1.45];let fi=1; // fi=1 berarti ukuran awal 100%; ubah daftar FS bila perlu
try{const v=parseInt(localStorage.getItem('fs2'));if(v>=0&&v<FS.length)fi=v}catch(e){}
function setFs(i){fi=Math.max(0,Math.min(FS.length-1,i));document.documentElement.style.setProperty('--fs',FS[fi]);$('#fsv').textContent=Math.round(FS[fi]*100)+'%';document.querySelector('[data-fs="-1"]').disabled=fi==0;document.querySelector('[data-fs="1"]').disabled=fi==FS.length-1;try{localStorage.setItem('fs2',fi)}catch(e){}}
setFs(fi);

// ===== DATABASE (Firestore SDK client; mode demo bila CFG kosong) =====
let store;
try{if(CFG.projectId){
 const V='10.12.2',A=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),S=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
 const db=S.getFirestore(A.initializeApp(CFG));
 store={live:1,
  sub:(c,from,cb)=>S.onSnapshot(from?S.query(S.collection(db,c),S.where('date','>=',from)):S.collection(db,c),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{err='Gagal membaca data ('+e.code+'). Periksa config dan rules Firestore.';render()}),
  add:(c,o)=>S.addDoc(S.collection(db,c),o),del:(c,id)=>S.deleteDoc(S.doc(db,c,id)),
  dump:async c=>(await S.getDocsFromServer(S.collection(db,c))).docs.map(d=>({id:d.id,...d.data()})),
  put:async(c,items)=>{ // buat dokumen baru dengan id asli; yang sudah ada dilewati (rules tidak mengizinkan update)
   const have=new Set((await S.getDocsFromServer(S.collection(db,c))).docs.map(d=>d.id)),nw=items.filter(x=>!have.has(x.id));
   for(let i=0;i<nw.length;i+=400){const b=S.writeBatch(db);nw.slice(i,i+400).forEach(({id,...o})=>b.set(S.doc(db,c,id),o));await b.commit()}
   return nw.length}};
}}catch(e){err='Firebase tidak bisa dimuat. Periksa koneksi internet.'}
if(!store){
 const m={catatan:[],jadwal:[]},ls={};
 try{for(const c in m)m[c]=JSON.parse(localStorage.getItem('demo_'+c))||[]}catch(e){}
 const save=c=>{try{localStorage.setItem('demo_'+c,JSON.stringify(m[c]))}catch(e){}},done=c=>{save(c);ls[c]()};
 const seed=()=>{ // data contoh 7 hari (karangan, bukan data pasien)
  const P=(d,hm,type,dd)=>{if(d==today&&hm>'11:30')return;m.catatan.push({id:'s'+m.catatan.length,date:d,type,by:hm>='06:30'&&hm<'18:00'?'Sari':'Dewi',t:new Date(d+'T'+hm).getTime(),d:dd})};
  for(let i=6;i>=0;i--){

function sheet(){
 $('#sh').scrollTop=0;
 if(!step){$('#sb').innerHTML=`<div class="sh"><div class="grip"></div><h2>Mau catat apa?</h2><div class="cats">${Object.keys(T).map(k=>`<button type="button" class="cat ${k}" data-k="${k}">${ic(IC[k])}${T[k]}</button>`).join('')}</div><button type="button" class="b2 w" id="cx">Batal</button></div>`;return}
 $('#sb').innerHTML=`<div class="sh"><div class="grip"></div><button type="button" class="b2 sm" id="bk">${ic('chevron_left')}Ganti jenis catatan</button><h2 class="ft ${kind}">${ic(IC[kind])}${T[kind]}</h2>`
 +`<label class="fld">Jam ${kind=='elim'?'ganti pampers':'kejadian'}<input type="time" id="jm" value="${jam}"></label>`+F[kind].map(([k,l,t,o])=>t=='n'?`<label class="fld">${l}<span class="u"><input inputmode="decimal" data-f="${k}" value="${esc(vals[k]??'')}"><i>${o}</i></span></label>`
  :t=='t'?`<label class="fld">${l}<textarea rows="2" data-f="${k}" placeholder="${esc(o||'')}">${esc(vals[k]||'')}</textarea></label>`
  :`<div class="fld">${l}<div class="chips" style="margin-top:6px">${o.map(x=>`<button type="button" class="chip${[].concat(vals[k]||[]).includes(x)?' on':''}" data-c="${k}" data-t="${t}" data-v="${esc(x)}">${x}</button>`).join('')}</div></div>`).join('')
 +`<label class="fld">Dicatat oleh<input id="by" value="${esc(nm)}" placeholder="Nama caregiver" autocomplete="name"></label><p class="er" id="er"></p><div class="acts"><button type="button" class="b2" id="cx">Batal</button><button type="button" class="b1" id="sv">Simpan</button></div></div>`}

// ===== BACKUP & IMPORT =====
let busy=0;
const okDate=s=>typeof s=='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const okId=s=>typeof s=='string'&&s.length>0&&s.length<=200&&!s.includes('/')&&!/^(\.|\.\.|__.*__)$/.test(s);
function clean(c,x){ // periksa dan bersihkan satu data dari file; null bila tidak valid
 if(!x||typeof x!='object'||!okId(x.id)||!okDate(x.date))return null;
 const s=v=>typeof v=='string'?v:'';
 if(c=='jadwal')return s(x.kind)?{id:x.id,kind:x.kind,date:x.date,time:s(x.time),note:s(x.note)}:null;
 if(!Object.keys(T).includes(x.type)||!Number.isFinite(x.t)||!x.d||typeof x.d!='object')return null;
 const d={};
 for(const[k,,t]of F[x.type]){const v=x.d[k];if(v==null||v==='')continue;
  if(t=='n'){if(Number.isFinite(v))d[k]=v}
  else if(t=='m'){if(Array.isArray(v)&&v.length)d[k]=v.map(String)}
  else if(typeof v=='string'||typeof v=='number')d[k]=String(v)}
 return{id:x.id,date:x.date,type:x.type,t:x.t,by:s(x.by),d}}
async function backup(){
 if(busy)return;busy=1;toast('Menyiapkan backup...');
 try{
  const[catatan,jadwal]=await Promise.all([store.dump('catatan'),store.dump('jadwal')]);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'logbook-mamah',version:1,exportedAt:new Date().toISOString(),catatan,jadwal})],{type:'application/json'}));
  a.download=`logbook-backup-${today}.json`;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(`Backup: ${catatan.length} catatan, ${jadwal.length} jadwal`)
 }catch(_){toast('Backup gagal, cek koneksi')}
 busy=0}
document.addEventListener('change',async e=>{
 if(e.target.id!='impf')return;
 const f=e.target.files[0];e.target.value='';
 if(!f||busy)return;busy=1;
 try{
  let j;try{j=JSON.parse(await f.text())}catch(_){}
  if(!j||j.app!='logbook-mamah'){toast('File bukan backup logbook');return}
  toast('Mengimpor...');let nw=0,skip=0;
  for(const c of['catatan','jadwal']){
   const seen=new Set(),ok=[];
   for(const x of Array.isArray(j[c])?j[c]:[]){const y=clean(c,x);if(y&&!seen.has(y.id)){seen.add(y.id);ok.push(y)}else skip++}
   const n=await store.put(c,ok);nw+=n;skip+=ok.length-n}
  toast(nw?`Import: ${nw} baru, ${skip} dilewati`:'Tidak ada data baru')
 }catch(_){toast('Import gagal, cek koneksi')}
 finally{busy=0}});

// ===== EVENT =====
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f)vals[t.dataset.f]=t.value;if(t.id=='by')nm=t.value});
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let x;
 if(x=g('[data-tab]')){tab=x.dataset.tab;render();scrollTo(0,0)}
 else if(x=g('[data-fs]')){setFs(fi+Number(x.dataset.fs))}
 else if(g('#pv')){cur=add(cur,-1);render()}
 else if(g('#nx')){cur=add(cur,1);render()}
 else if(x=g('[data-go]')){cur=x.dataset.go;tab='now';render();scrollTo(0,0)}
 else if(g('#add')){vals={};step=0;jam=new Date().toTimeString().slice(0,5);sheet();$('#sh').showModal()}
 else if(g('#bk')){jam=$('#jm')?.value||jam;step=0;sheet()}
 else if(g('#cx'))$('#sh').close();
 else if(x=g('[data-k]')){jam=$('#jm')?.value||jam;kind=x.dataset.k;vals={};step=1;sheet()}
 else if(x=g('[data-c]')){const{c,t,v}=x.dataset;
  if(t=='m'){const a=vals[c]||[];vals[c]=a.includes(v)?a.filter(i=>i!=v):[...a,v];x.classList.toggle('on')}
  else{const on=vals[c]!==v;vals[c]=on?v:'';x.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));x.classList.toggle('on',on)}}
 else if(g('#sv')){const d={};let bad='';
  for(const[k,,t]of F[kind]){const v=vals[k];if(v==null||v===''||(Array.isArray(v)&&!v.length))continue;d[k]=t=='n'?Number(String(v).replace(',','.')):v;if(t=='n'&&isNaN(d[k]))bad='Isi angka saja.'}
  const ks=Object.keys(d).filter(k=>k!='cat');
  if(!nm.trim())bad='Isi nama pencatat.';else if(!bad&&(KEY[kind]?!ks.includes(KEY[kind]):!ks.length))bad=KEY[kind]?'Pilih "'+F[kind].find(f=>f[0]==KEY[kind])[1]+'" dulu.':'Isi minimal satu kolom.';
  const hm=$('#jm').value;if(!bad&&!hm)bad='Isi jamnya dulu.';if(bad){$('#er').textContent=bad;return}
  try{localStorage.setItem('by',nm.trim())}catch(_){}
  store.add('catatan',{date:cur,type:kind,t:hm?new Date(cur+'T'+hm).getTime():Date.now(),by:nm.trim(),d}).catch(()=>toast('Gagal menyimpan, cek koneksi'));
  $('#sh').close();toast('Tersimpan')}
 else if(g('#sj')){const d=$('#jd').value,r=$('#jr').value;if(!d)return toast('Pilih tanggal');
  for(let i=0;i<(r=='w'?8:r=='m'?6:1);i++)store.add('jadwal',{kind:$('#jk').value,date:r=='m'?add(d,0,i):add(d,7*i),time:$('#jt').value,note:$('#jn').value.trim()});toast('Jadwal tersimpan')}
 else if(x=g('[data-del]')){
  if(x.dataset.arm)store.del(x.dataset.col,x.dataset.del);
  else{x.dataset.arm=1;x.textContent='Yakin hapus?';setTimeout(()=>{if(x.isConnected){delete x.dataset.arm;x.textContent='Hapus'}},3000)}}
 else if(g('#rs')){store.reset(1);toast('Data contoh 7 hari terisi')}
 else if(g('#cl')){store.reset(0);toast('Data demo dikosongkan')}
 else if(g('#bkp'))backup();
 else if(g('#imp'))$('#impf').click();
 else if(g('#cp')){const t=report();
  navigator.clipboard.writeText(t).then(()=>toast('Laporan tersalin')).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy');toast('Laporan tersalin')}catch(_){toast('Tidak bisa menyalin')}a.remove()})}
});

store.sub('catatan',add(today,-DAYS),x=>{all=x;render()});
store.sub('jadwal',null,x=>{jad=x;render()});
render();
</script>
</body>
</html>
